name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab_secret
          POSTGRES_DB: collab_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://collab:collab_secret@localhost:5432/collab_db?schema=public

      - name: Typecheck
        run: npm run typecheck

      - name: Run Database Migrations
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://collab:collab_secret@localhost:5432/collab_db?schema=public

      - name: Seed Database Fixtures
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://collab:collab_secret@localhost:5432/collab_db?schema=public

      - name: Run Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://collab:collab_secret@localhost:5432/collab_db?schema=public
          JWT_SECRET: super_secret_jwt_key_at_least_32_characters_long
          REDIS_URL: redis://localhost:6379

      - name: Build All Packages and Apps
        run: npm run build
