services:
  postgres:
    image: postgres:16-alpine
    container_name: collab-postgres
    restart: always
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab_secret
      POSTGRES_DB: collab_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: collab-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: collab_postgres_data
  redis_data:
    name: collab_redis_data
